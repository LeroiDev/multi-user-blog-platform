# docker-compose.yml
version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/app:/app/app        # for live-reload in dev
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: your_secret_key_here
      # DATABASE_URL: sqlite:///./blog.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # volumes:   ← remove this binding!
    #  - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    command: serve -s dist -l 5173       # swap to `serve -s dist` for prod
